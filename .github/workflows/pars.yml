name: Nightly pars
on:
  schedule:
    - cron: "0 7 * * *"   # 3 am Miami in summer time (EDT)
    - cron: "0 8 * * *"   # 3 am Miami in winter time (EST)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only run at 3 am Miami time
        id: gate
        run: |
          H=$(TZ=America/New_York date +%H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$H" = "03" ]; then echo "go=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == '1'
        with: { python-version: "3.12" }
      - name: Build pars.json
        if: steps.gate.outputs.go == '1'
        env:
          SQUARE_TOKEN: ${{ secrets.SQUARE_TOKEN }}
          COUNTS_CSV_URL: ${{ secrets.COUNTS_CSV_URL }}
        run: python pars.py
      - name: Publish
        if: steps.gate.outputs.go == '1'
        run: |
          git config user.name "lobsteria-pars-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pars.json
          git commit -m "Pars for $(TZ=America/New_York date +%F)" || echo "no change"
          git push
